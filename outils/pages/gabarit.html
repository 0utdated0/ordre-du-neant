<!-- Sans WebGL (accélération matérielle coupée, carte graphique bloquée),
     les scènes passent en images fixes : voir repli.js. ?sans-3d simule ce cas. -->
<script>(function(){var d=document.documentElement,ok=false;if(/[?&]sans-3d(=|&|$)/.test(location.search)){var gc=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(t){return /webgl/i.test(t)?null:gc.apply(this,arguments);};}try{var c=document.createElement('canvas'),g=c.getContext('webgl2')||c.getContext('webgl');ok=!!g;var x=g&&g.getExtension('WEBGL_lose_context');if(x){x.loseContext();}}catch(e){}if(!ok){d.className+=' sans-3d';}})();</script>
<!-- Sortie de saut : posée par la page d'attente à l'ouverture, pour que le
     site apparaisse en arrivée et non d'un coup. Lue avant le premier affichage. -->
<script>try{var odnSaut=+sessionStorage.getItem('odn-arrivee');if(odnSaut&&Date.now()-odnSaut<20000){document.documentElement.className+=' arrivee';}}catch(e){}</script>
