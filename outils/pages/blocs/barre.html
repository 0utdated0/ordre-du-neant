<div class="barre" id="barre">
  <a class="barre__sceau" href="/" aria-label="Accueil"><img src="/assets/embleme.webp" alt="" width="900" height="1251"></a>
  <span class="barre__nom">L'Ordre du Néant</span>

  <button class="barre__bouton" type="button" id="menu-bouton"
          aria-expanded="false" aria-controls="menu" aria-label="Ouvrir le menu">
    <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
  </button>

  <nav class="menu" id="menu" aria-label="Sections du site">
    {{MENU}}
  </nav>

  <!-- Radio de l'Ordre : masquée tant que /api/radio n'a pas répondu. -->
  <button class="radio-mini" type="button" data-radio-bouton hidden
          aria-pressed="false" aria-label="Écouter la Radio de l'Ordre">
    <span class="radio-mini__icone" aria-hidden="true"></span>
    <span class="egaliseur" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span class="radio-mini__texte"><em>Radio</em><strong data-radio="resume">Radio de l'Ordre</strong></span>
  </button>

  <!-- Le menu a déjà une entrée « Rejoindre » qui mène à la page
       d'admission. Ce bouton-ci ouvre le Discord : deux destinations
       différentes ne peuvent pas porter le même mot. -->
  <a class="barre__cta" href="https://discord.gg/6UWSwhzeFY" rel="noopener">Discord</a>
</div>
