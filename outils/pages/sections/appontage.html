<section class="travail" id="appontage" aria-label="{{ACTE}}, l'Appontage">
  <div class="travail__collant">
    <div class="travail__scene" id="appontage-scene"></div>
    <div class="travail__voile" aria-hidden="true"></div>

    <p class="approche__num" aria-hidden="true">{{ACTE}}</p>

    <div class="travail__fiche" aria-hidden="true">
      <p class="travail__titre">Appontage <strong>pont 3</strong></p>
      <dl class="travail__lignes">
        <div><dt>Appareil</dt><dd>Le Portefaix, cargo</dd></div>
        <div><dt>Station</dt><dd>Le Seuil</dd></div>
        <div><dt>Manœuvre</dt><dd>Descente sur rétrofusées</dd></div>
      </dl>
    </div>

    <div class="approche__textes">
      <p class="fragment"><span>Le Portefaix rentre de mission, cales pleines.</span></p>
      <p class="fragment"><span>Le Seuil lui ouvre un pont et allume le cercle.</span></p>
      <p class="fragment"><span>Rétrofusées. Le pont se couvre de poussière.</span></p>
      <p class="fragment"><span>Posé. On décharge, et on repart.</span></p>
    </div>
  </div>
</section>
