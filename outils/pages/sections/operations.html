<section class="acte acte--donnees acte--operations" id="operations">

      <p class="acte__num">{{ACTE}}</p>
      <h2 class="balaye">Les opérations</h2>

    <p class="avis" id="avis-operations" hidden></p>
    <ol class="operations__liste" id="operations-liste" role="list"></ol>

    <h3 class="operations__archives-titre" id="titre-archives" hidden>Déjà menées</h3>
    <ol class="operations__liste operations__liste--passees" id="operations-archives" role="list" hidden></ol>
  </div>
</section>
