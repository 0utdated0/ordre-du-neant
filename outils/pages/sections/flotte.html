<section class="acte acte--flotte" id="flotte">
  <div class="contenu contenu--large">
    <div class="entete entete--centre revele">
      <p class="acte__num">{{ACTE}}</p>
      <h2 class="balaye">La flotte</h2>
      <p class="intro">
        Neuf appareils de la classification interne de l&rsquo;Ordre, projetés en hologramme.
        Faites-les tourner, approchez la souris.
      </p>
    </div>

    <div class="holo revele">
      <div class="holo__onglets" id="flotte-onglets" role="tablist" aria-label="Appareils"></div>

      <div class="holo__table">
        <div class="holo__scene" id="flotte-scene"></div>
        <span class="holo__coin holo__coin--hg" aria-hidden="true"></span>
        <span class="holo__coin holo__coin--hd" aria-hidden="true"></span>
        <span class="holo__coin holo__coin--bg" aria-hidden="true"></span>
        <span class="holo__coin holo__coin--bd" aria-hidden="true"></span>
        <p class="holo__mention" aria-hidden="true">Projection · classification interne</p>
      </div>

      <div class="holo__fiche" aria-live="polite">
        <h3 id="flotte-nom">&nbsp;</h3>
        <p class="holo__classe" id="flotte-classe"></p>
        <p class="holo__texte" id="flotte-texte"></p>
        <dl class="holo__donnees" id="flotte-fiche"></dl>
      </div>
    </div>
  </div>
</section>
